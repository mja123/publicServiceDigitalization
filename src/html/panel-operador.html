<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Operador - Gestión de Poda</title>
  <link rel="stylesheet" href="../css/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    .solicitud-total {
      font-weight: bold;
      color: #0074d9;
      margin-bottom: 0.5rem;
    }
  </style>
</head>
<body>
  <div id="navbar-container"></div>

  <main class="operador-container">
    <section class="operador-header">
      <h1><i class="fas fa-tasks"></i> Panel de Gestión de Solicitudes</h1>
      <div class="filtros">
        <div class="filtro-group">
          <label for="filtro-estado"><i class="fas fa-filter"></i> Estado:</label>
          <select id="filtro-estado">
            <option value="todas">Todas las solicitudes</option>
            <option value="pendiente">Pendientes</option>
            <option value="aprobada">Aprobadas</option>
            <option value="rechazada">Rechazadas</option>
          </select>
        </div>
        <div class="filtro-group">
          <label for="busqueda"><i class="fas fa-search"></i> Buscar:</label>
          <input type="text" id="busqueda" placeholder="ID, DNI o dirección" />
        </div>
      </div>
    </section>

    <section class="solicitudes-grid" id="contenedor-solicitudes">
      <!-- Aquí se insertarán las tarjetas desde PHP -->
    </section>
  </main>

  <!-- Modal -->
  <div class="modal-operador" id="modalDetalle">
    <div class="modal-contenido">
      <div class="modal-header">
        <h2>Solicitud</h2>
        <button class="btn-cerrar" onclick="cerrarModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="info-section">
          <h3><i class="fas fa-info-circle"></i> Información Básica</h3>
          <div class="info-grid" id="info-basica"></div>
        </div>

        <div class="info-section">
          <h3><i class="fas fa-map-marked-alt"></i> Ubicación</h3>
          <div class="mapa-placeholder">
            <p id="modal-coordenadas">Coordenadas: -</p>
          </div>
        </div>

        <div class="info-section">
          <h3><i class="fas fa-images"></i> Evidencia Fotográfica</h3>
          <div class="galeria-imagenes">
            <div class="imagen-item">
              <img src="../assets/placeholder-tree.jpg" alt="Foto del árbol" />
            </div>
          </div>
        </div>

        <div class="acciones-section">
          <div class="acciones-group">
            <button class="btn-rechazar" onclick="rechazarSolicitud()">
              <i class="fas fa-times-circle"></i> Rechazar
            </button>
            <button class="btn-aprobar" onclick="aprobarSolicitud()">
              <i class="fas fa-check-circle"></i> Aprobar
            </button>
          </div>

          <div class="asignacion-section">
            <label for="asignar-a"><i class="fas fa-users-cog"></i> Asignar a:</label>
            <select id="asignar-a">
              <option value="cuadrilla1">Cuadrilla Zona Norte</option>
              <option value="cuadrilla2">Cuadrilla Zona Sur</option>
              <option value="jefe">Jefe de Limpieza</option>
            </select>
            <button class="btn-asignar" onclick="asignarTarea()">
              <i class="fas fa-paper-plane"></i> Asignar
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <div class="footer-section">
        <h3>Acciones Rápidas</h3>
        <a href="#"><i class="fas fa-plus-circle"></i> Nueva Solicitud</a>
        <a href="#"><i class="fas fa-history"></i> Historial</a>
      </div>
      <div class="footer-section">
        <h3>Soporte</h3>
        <p><i class="fas fa-phone"></i> 0261-1234567 Int. 456</p>
        <p><i class="fas fa-envelope"></i> soporte-poda@guaymallen.gob.ar</p>
      </div>
    </div>
  </footer>

  <script>
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar-container").innerHTML = data;
      });

    function mostrarDetalleSolicitud(btn) {
      document.getElementById("modalDetalle").style.display = "block";
      document.querySelector("#modalDetalle .modal-header h2").textContent =
        "Solicitud #PODA-" + btn.dataset.id;
      document.getElementById("info-basica").innerHTML = `
        <div>
          <p><strong>Solicitante:</strong> ${btn.dataset.nombre}</p>
          <p><strong>DNI:</strong> ${btn.dataset.dni}</p>
        </div>
        <div>
          <p><strong>Fecha solicitud:</strong> ${btn.dataset.fecha}</p>
          <p><strong>Teléfono:</strong> No registrado</p>
        </div>
      `;
      document.getElementById("modal-coordenadas").textContent =
        "Coordenadas: " + (btn.dataset.coordenadas || "-");
    }

    function cerrarModal() {
      document.getElementById("modalDetalle").style.display = "none";
    }

    window.onclick = function (event) {
      const modal = document.getElementById("modalDetalle");
      if (event.target == modal) {
        modal.style.display = "none";
      }
    };

    function aprobarSolicitud() {
      alert("Solicitud aprobada y asignada");
      cerrarModal();
    }

    function rechazarSolicitud() {
      const motivo = prompt("Ingrese el motivo de rechazo:");
      if (motivo) {
        alert(`Solicitud rechazada. Motivo: ${motivo}`);
        cerrarModal();
      }
    }

    function asignarTarea() {
      const asignacion = document.getElementById("asignar-a").value;
      alert(`Tarea asignada a: ${asignacion}`);
    }

    // 🚀 Funciones agregadas
    function rechazarIndividual(id) {
      if (confirm("¿Seguro que querés rechazar esta solicitud?")) {
        fetch("../Scrips/rechazar-solicitud.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "id=" + id
        })
        .then(res => res.text())
        .then(() => location.reload());
      }
    }

    function rechazarTodas(dni) {
      if (confirm("¿Rechazar TODAS las solicitudes del DNI " + dni + "?")) {
        fetch("../Scrips/rechazar-todas.php", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: "dni=" + dni
        })
        .then(res => res.text())
        .then(() => location.reload());
      }
    }

    fetch("../Scrips/cargar-solicitudes.php")
      .then(response => response.text())
      .then(html => {
        document.getElementById("contenedor-solicitudes").innerHTML = html;
      })
      .catch(error => {
        document.getElementById("contenedor-solicitudes").innerHTML =
          "<p>Error al cargar solicitudes.</p>";
        console.error("Error al cargar solicitudes:", error);
      });
  </script>
</body>
</html>
